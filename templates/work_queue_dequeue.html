<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue & Dequeue Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="site-container page-wrapper">

        <header>
            <div class="logo" onclick="window.location.href='{{ url_for('profile') }}'">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Portfolio Logo">
                My Portfolio
            </div>
            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('profile') }}">Profile</a>
                <a href="{{ url_for('works') }}" class="active">Works</a>
                <a href="{{ url_for('contacts') }}">Contacts</a>
            </nav>
        </header>

        <main>
            <h1>Queue & Dequeue Tool</h1>

            <form method="POST">
                <input type="text" name="value" placeholder="Enter value to enqueue">
                <button type="submit" name="action" value="enqueue">Enqueue</button>
                <button type="submit" name="action" value="dequeue">Dequeue</button>
            </form>

            {% if message %}
            <div class="result-box">
                <h2>Status:</h2>
                <p>{{ message }}</p>
            </div>
            {% endif %}

            <div class="result-box">
                <h2>Current Queue:</h2>
                {% if queue %}
                    <ul>
                        {% for item in queue %}
                            <li>{{ item }}</li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p>The queue is empty.</p>
                {% endif %}
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Personal Web Portfolio</p>
        </footer>

    </div>
</body>
</html>
